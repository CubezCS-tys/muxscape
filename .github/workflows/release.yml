name: Release (draft)

# Builds the Windows installer on a clean runner and attaches it to a DRAFT
# prerelease. Nothing is published until a maintainer reviews and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix ui
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muxscape ${{ github.ref_name }} (alpha)"
          releaseDraft: true
          prerelease: true
          args: --bundles nsis
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Tee-Object SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: SHA256SUMS, path: SHA256SUMS.txt }
