[workspace]
resolver = "2"
members = ["crates/tmux-control", "crates/mux-ssh", "crates/mux-core", "crates/mux-devserver", "src-tauri"]
# src-tauri needs webkit2gtk system libraries; keep it out of default builds so
# `cargo test` works on headless machines.
default-members = ["crates/tmux-control", "crates/mux-ssh", "crates/mux-core", "crates/mux-devserver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tmux-control = { path = "crates/tmux-control" }
mux-ssh = { path = "crates/mux-ssh" }
mux-core = { path = "crates/mux-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
